services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videoops_test
      POSTGRES_USER: videoops
      POSTGRES_PASSWORD: videoops_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoops -d videoops_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
