[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videoops-studio"
version = "0.13.0"
description = "Durable AI Story and Remix video production workflow"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "alembic>=1.14,<2",
  "edge-tts>=6.1.10,<8",
  "google-api-python-client>=2.120,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1,<2",
  "gradio>=4.20,<7",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic>=2.6,<3",
  "SQLAlchemy>=2.0.36,<3",
  "yt-dlp>=2024.3.10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23.5,<2",
  "ruff>=0.11,<1",
]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests", "migrations"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend-exclude = ["docs"]
